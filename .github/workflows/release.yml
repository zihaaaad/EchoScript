name: EchoScript Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Broken Library Manifests (Enterprise Standard)
        run: |
          python3 -c "
          import os, glob
          pub_cache = os.path.expanduser('~/.pub-cache')
          for manifest in glob.glob(f'{pub_cache}/**/isar_flutter_libs*/android/src/main/AndroidManifest.xml', recursive=True):
              print(f'Surgically patching: {manifest}')
              with open(manifest, 'r') as f:
                  content = f.read()
              content = content.replace('package=\"dev.isar.isar_flutter_libs\"', '')
              if 'xmlns:tools' not in content:
                  content = content.replace('<manifest', '<manifest xmlns:tools=\"http://schemas.android.com/tools\"')
              with open(manifest, 'w') as f:
                  f.write(content)
          "

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
