name: EchoScript CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Broken Library Manifests (Enterprise Standard)
        run: |
          # Use Python for surgical XML manipulation - significantly safer than sed for CI
          python3 -c "
          import os, glob
          pub_cache = os.path.expanduser('~/.pub-cache')
          for manifest in glob.glob(f'{pub_cache}/**/isar_flutter_libs*/android/src/main/AndroidManifest.xml', recursive=True):
              print(f'Surgically patching: {manifest}')
              with open(manifest, 'r') as f:
                  content = f.read()
              # Remove the incompatible package attribute while maintaining XML validity
              content = content.replace('package=\"dev.isar.isar_flutter_libs\"', '')
              # Ensure the tools namespace is present for the merger
              if 'xmlns:tools' not in content:
                  content = content.replace('<manifest', '<manifest xmlns:tools=\"http://schemas.android.com/tools\"')
              with open(manifest, 'w') as f:
                  f.write(content)
          "

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build AppBundle
        run: flutter build appbundle --release
