name: EchoScript CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Isar Manifest for AGP 8+ Compatibility
        run: |
          for manifest in $(find ~/.pub-cache -name "AndroidManifest.xml" -path "*isar*"); do
            echo "Patching $manifest"
            # Remove package attribute
            sed -i 's/package="dev\.isar\.isar_flutter_libs"//g' "$manifest"
            # Ensure xmlns:tools exists for merge rules
            if ! grep -q "xmlns:tools" "$manifest"; then
              sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' "$manifest"
            fi
            # Basic validation: ensure it still looks like XML
            head -n 1 "$manifest" | grep -q "<manifest" || (echo "ERROR: Broken manifest" && exit 1)
          done

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build AppBundle
        run: flutter build appbundle --release
