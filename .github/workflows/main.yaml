name: EchoScript Enterprise CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Code Generation
        run: flutter pub run build_runner build --delete-conflicting-outputs
        
      - name: Analyze Code
        run: flutter analyze
        
      - name: Run Tests
        run: flutter test
        
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
        
      - name: Build AppBundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          # Append the run number to the version for the release tag if it's a pre-release
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=$VERSION+${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          name: EchoScript v${{ steps.extract_version.outputs.FULL_VERSION }}
          tag_name: ${{ github.ref_name == 'main' && format('v{0}', steps.extract_version.outputs.FULL_VERSION) || github.ref_name }}
          draft: false
          prerelease: ${{ github.ref != 'refs/tags/v*' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_wiki:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Prepare Wiki Content
        run: |
          mkdir wiki_content
          cp DOCS.md wiki_content/Home.md
          
      - name: Push to Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          strategy: 'clone'
          path: 'wiki_content/'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
